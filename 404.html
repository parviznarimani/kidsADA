<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>کیدزآدا</title>
<script>
// GitHub Pages serves this file for unknown paths; hand valid card paths to the app.
const parts = location.pathname.split('/').filter(Boolean);
const token = parts.pop() || '';
if (/^pid[a-zA-Z0-9]+_key[a-zA-Z0-9]+$/.test(token)) {
  const root = '/' + (parts.length ? parts.join('/') + '/' : '');
  location.replace(root + '?card=' + encodeURIComponent(token));
}
</script>
</head>
<body><p>در حال باز کردن کارت… اگر صفحه باز نشد، لینک کارت را بررسی کنید.</p></body>
</html>
