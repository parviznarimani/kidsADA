<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>کارت کیدزآدا</title>
<script>
// Resolve bundled assets relative to the app root, including token URLs.
if (/^pid[a-zA-Z0-9]+_key[a-zA-Z0-9]+$/.test(location.pathname.split('/').filter(Boolean).pop() || '')) {
 const base = document.createElement('base');
 base.href = location.pathname.replace(/pid[a-zA-Z0-9]+_key[a-zA-Z0-9]+\/?$/, '');
 document.head.append(base);
}
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main>

<article class="card" aria-label="اطلاعات کارت کودک">
<img class="brand-logo" src="assets/medias/kidsada-logo.png" alt="کیدزآدا" width="76" height="50">
<div class="photo">
<div class="skeleton" role="img" aria-label="تصویر کودک موجود نیست"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="32" cy="23" r="11"/><path d="M12 55c0-13 8-20 20-20s20 7 20 20"/></svg></div>
<img id="photo" alt="تصویر کودک" hidden>
</div>
<h1 id="name">نام کودک</h1>
<p class="intro">برای ارتباط با خانواده، یکی از شماره‌ها را لمس کنید.</p>
<div class="contacts">
<a class="contact" id="father" aria-label="شماره پدر" aria-disabled="true"><span class="icon" aria-hidden="true"><img src="assets/medias/father.svg" alt=""></span><span class="details"><bdi class="number"></bdi></span></a>
<a class="contact" id="mother" aria-label="شماره مادر" aria-disabled="true"><span class="icon" aria-hidden="true"><img src="assets/medias/mother.svg" alt=""></span><span class="details"><bdi class="number"></bdi></span></a>
</div>
<p class="note">در صورتی که والدین در دسترس نبودند، با پشتیبانی تماس بگیرید.</p>
</article>
<footer><a href="https://kidsada.ir/smartcard/">درخواست کارت</a><a href="https://kidsada.ir/">صفحه اصلی</a><a href="https://kidsada.ir/contact-us/">پشتیبانی</a></footer>
<p class="demo" id="status" role="status" aria-live="polite"></p>
</main>
<script src="main.js" defer></script>
</body>
</html>
